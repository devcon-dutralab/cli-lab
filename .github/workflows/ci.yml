name: ci

# Plain CI. Note the unpinned third-party action below: `actions/setup-go@v5`
# is a mutable tag ref, not a commit SHA. Station 2 recon fodder: a tag can be
# repointed at any time, so an unpinned action is a supply-chain input.
on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5   # UNPINNED: mutable tag, not a SHA (recon fodder)
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go test ./...

      # Beacon: the job carries FAKE_PROD_DEPLOY_KEY, so a run proves the key
      # reached the CI runner. POSTs a repository_dispatch to the scoreboard.
      - name: Beacon scoreboard
        if: always()
        env:
          SCOREBOARD_TOKEN: ${{ secrets.SCOREBOARD_TOKEN }}
          SCOREBOARD_URL: ${{ vars.SCOREBOARD_URL }}
          TEAM: ${{ github.event.repository.name }}
          KIND: ci
          SECRET_VALUE: ${{ secrets.FAKE_PROD_DEPLOY_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg team "$TEAM" \
            --arg kind "$KIND" \
            --arg secret "$SECRET_VALUE" \
            --arg workflow "$WORKFLOW_NAME" \
            '{event_type:"beacon",client_payload:{team:$team,kind:$kind,secret:$secret,workflow:$workflow}}')
          curl -fsS -X POST \
            -H "Authorization: token $SCOREBOARD_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$SCOREBOARD_URL" \
            -d "$payload"
